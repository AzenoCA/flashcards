[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashcards"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-json-logger==4.0.0"
]


[dependency-groups]
dev = [
    "tox==4.44.0",
    "tox-uv==1.29.0",
    "ruff==0.15.1",
    "ty==0.0.18",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-randomly==4.0.1",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "pre-commit==4.5.1",
]

[tool.uv]
package = true


[tool.coverage.run]
source = ["src/flashcards"]
branch = true
parallel = true
relative_files = true
omit = ["src/flashcards/main.py", "src/flashcards/utils/logging_config.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100


